:root{--bg:#121212;--tile:#1f1f1f;--gold:#AF9061;--green:#1E8E3E;--red:#C1121F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);color:#fff;font-family:N,'Arial Narrow',Arial,sans-serif;font-weight:900;overflow:hidden;cursor:none}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg)}
.p{position:absolute;inset:0;display:none;flex-direction:column;padding:36px 70px 96px}
.p.on{display:flex}
h1{font-family:MS;font-weight:900;font-size:100px;line-height:1;letter-spacing:1px;height:130px;display:flex;align-items:center;gap:30px;white-space:nowrap}
h1:before{content:'';display:block;width:18px;height:96px;background:var(--gold);border-radius:4px}
h1 .dim{color:#9a9a9a}
.foot{position:absolute;left:0;right:0;bottom:0;height:86px;display:flex;justify-content:space-between;align-items:center;padding:0 70px;font-family:MS;font-weight:800;font-size:44px;color:#bdbdbd}
.foot img{height:58px}
.bar{position:absolute;left:0;bottom:0;height:8px;background:var(--gold)}
.tiles{flex:1;display:flex;gap:40px}
.tile{flex:1;border-radius:30px;background:var(--tile);display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.tile .n{font-size:430px;line-height:.9}
.tile .n.m{font-size:340px}
.tile .l{font-family:MS;font-weight:900;font-size:76px;line-height:1.05;color:#e6e6e6;white-space:nowrap;text-align:center}
.tile .s{font-family:MS;font-weight:800;font-size:50px;color:#bdbdbd;margin-top:10px;white-space:nowrap}
.green{background:var(--green)!important}.red{background:var(--red)!important}
.rows{flex:1;display:flex;flex-direction:column;justify-content:space-around}
.row{display:flex;align-items:center;gap:40px;height:190px}
.row .nm{width:620px;font-size:150px;line-height:1;white-space:nowrap;overflow:hidden}
.row .track{flex:1;height:130px;border-radius:16px;background:#2a2a2a;overflow:hidden;position:relative}
.row .fill{height:100%;background:var(--gold)}
.row .num{width:440px;text-align:right;font-size:200px;line-height:1;white-space:nowrap}
.row .num small{font-size:110px;color:#bdbdbd}
.blocks{flex:1;display:flex;gap:40px}
.blk{flex:1;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:8px solid #fff}
.blk .wl{font-size:150px;line-height:1;background:#fff;color:#000;padding:6px 36px;border-radius:20px}
.blk .n{font-size:380px;line-height:1}
.ab{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:60px}
.ab .w{font-family:MS;font-weight:900;font-size:230px;line-height:1}
.ab .v{font-size:560px;line-height:.82}
.ab .s{font-family:MS;font-weight:800;font-size:64px;margin-top:14px;white-space:nowrap}
.ab .k{position:absolute;top:44px;left:70px;font-family:MS;font-weight:900;font-size:64px;opacity:.9}
.big{font-size:300px;line-height:1;white-space:nowrap}
.goalbar{height:220px;border-radius:30px;background:#2a2a2a;position:relative;overflow:hidden;margin:30px 0}
.goalbar .f{position:absolute;left:0;top:0;bottom:0;background:var(--gold)}
.chart{flex:1;display:flex;align-items:flex-end;gap:22px;position:relative;padding-top:20px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart .c div{width:100%;background:#8a8a8a;border-radius:10px 10px 0 0}
.chart .c.last div{background:var(--gold)}
.chart .gl{position:absolute;left:0;right:0;border-top:8px dashed #1E8E3E}
.lt{display:flex;align-items:baseline;gap:40px;font-size:230px;line-height:1;white-space:nowrap}
.lt .a{font-family:MS;font-weight:900;font-size:90px;color:#bdbdbd}
.lt .g{color:#5cd17a}
.tag{font-size:120px;line-height:1;padding:10px 40px;border-radius:20px;min-width:560px;text-align:center}
.list{flex:1;display:flex;flex-direction:column;justify-content:space-around}

<div class="gl" style="bottom:${100*D.goal/mx}%"></div></div>`));
const up=D.pace_week>=D.pace_4wk;
P.push(el(`<h1>UNITS / DAY</h1><div class="tiles">
<div class="tile ${up?'green':''}"><div class="n">${Math.round(D.pace_week)}</div><div class="l">THIS WEEK</div></div>
<div class="tile"><div class="n">${Math.round(D.pace_4wk)}</div><div class="l">LAST 4 WEEKS</div></div></div>`));
P.push(el(`<h1>ROAD TO ${D.goal} WEEKS</h1><div class="calc">CALCULATED</div><div class="tiles">
<div class="tile"><div class="n">${D.target}</div><div class="l">GOAL / DAY</div></div>
<div class="tile ${D.ttg!=null?'green':''}"><div class="n">${D.ttg==null?'–':Math.max(1,Math.round(D.ttg))}</div><div class="l">WEEKS TO ${D.goal}-WK LEAD</div><div class="s">IF WE HOLD ${D.target}/DAY</div></div></div>`));
const W=D.waiting.filter(w=>w.n!=='OTHER'||w.u>0);
for(let i=0;i<W.length;i+=4){const part=W.slice(i,i+4);
 P.push(el(`<h1>WAITING <span class="dim">· DAYS OF WORK</span></h1><div class="rows">${part.map(w=>`<div class="row"><div class="nm">${w.n}${w.n==='OTHER'&&D.unknown?` <span style="color:#F2C500;font-size:60px">${D.unknown} UNKNOWN</span>`:''}</div>
 <div class="num" style="flex:1;text-align:left">${w.u}</div><div class="num">${w.d==null?'–':Math.round(w.d)}<small> D</small></div></div>`).join('')}</div>`));}
if(D.overdue>0){
 P.push(el(`<h1>BEHIND PROMISE</h1><div class="tiles"><div class="tile red"><div class="n">${D.overdue}</div><div class="l">OVERDUE</div></div>
 <div class="tile"><div class="n">${D.oldest}</div><div class="l">DAYS OLDEST</div></div></div>`));
 if(D.oldest_weeks.length) P.push(el(`<h1>BUILD THESE COLORS FIRST</h1><div class="blocks">${D.oldest_weeks.map(w=>`<div class="blk" style="background:${w[1]}"><div class="wl">${w[0]}</div><div class="n" style="text-shadow:0 0 18px #000,0 0 6px #000">${w[2]}</div></div>`).join('')}</div>`));
}else P.push(el(`<div class="ab green" style="background:var(--green)"><div class="w">ALL CAUGHT UP</div><div class="s" style="font-size:90px">0 ORDERS PAST PROMISE</div></div>`));
const R=D.redo;
if(R==null) P.push(el(`<h1>QUALITY</h1><div class="tiles">
<div class="tile"><div class="n">${D.remakes}</div><div class="l">REMAKES</div><div class="s">LAST 4 WEEKS</div></div>
<div class="tile"><div class="l" style="font-size:90px;color:#9a9a9a">RETURNS</div><div class="s">NO REDO DATA YET</div></div></div>`));
else{const src=w=>`<div class="calc">REDO${w?' · '+w:''}${R.ok?'':' · AS OF '+R.asof}${R.since?' · DATA SINCE '+R.since:''}</div>`;
 P.push(el(`<h1>RETURNS + CLAIMS</h1>${src('')}<div class="tiles">
 <div class="tile ${R.d7?'':'green'}"><div class="n">${R.d7}</div><div class="l">LAST 7 DAYS</div></div>
 <div class="tile"><div class="n">${R.d30}</div><div class="l">LAST 30 DAYS</div></div>
 <div class="tile ${R.open?'red':''}"><div class="n">${R.open}</div><div class="l">OPEN NOW</div><div class="s">IN REDO</div></div></div>`));
 if(R.reasons.length) P.push(el(`<h1>WHY <span class="dim">· 30 DAYS</span></h1>${src('')}<div class="rows">${R.reasons.map(x=>`<div class="row"><div class="nm" style="flex:1;width:auto">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('')}</div>`));
 if(R.products.length) P.push(el(`<h1>RETURNED</h1>${src("30 DAYS")}<div class="rows">${R.products.map(x=>`<div class="row"><div class="nm" style="flex:1;width:auto">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('')}</div>`));}
const items=[...D.rush.map(o=>['RUSH','#C1121F','#fff',o]),...D.check.map(o=>['CHECK HAND','#F2C500','#000',o])];
if(items.length){const show=items.slice(0,3);const more=items.length-show.length;
 P.push(el(`<h1>FLAGS${more>0?` <span class="dim">+${more} MORE</span>`:''}</h1><div class="list">${show.map(x=>`<div class="it"><div class="tag" style="background:${x[1]};color:${x[2]}">${x[0]}</div><div class="o">${x[3]}</div></div>`).join('')}</div>`));}
const host=document.getElementById('panels');P.forEach(p=>host.appendChild(p));
document.getElementById('asof').textContent='UPDATED '+D.asof.toUpperCase();
if(demo)document.getElementById('demo').style.display='block';
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);const g=document.getElementById('stage');g.style.transform=`scale(${s})`;g.style.left=((innerWidth-1920*s)/2)+'px';g.style.top=((innerHeight-1080*s)/2)+'px'}
addEventListener('resize',fit);fit();
// Clock-synced rotation: every screen showing this file is on the same panel at the same moment.
function tick(){const t=Date.now();const i=fixed!=null?fixed%P.length:Math.floor(t/ROT)%P.length;
 if(i===0||fixed===0)abP.innerHTML=aheadBehind();
 P.forEach((p,j)=>p.classList.toggle('on',j===i));
 document.getElementById('bar').style.width=(fixed!=null?0:((t%ROT)/ROT*100))+'%';
 document.getElementById('stale').style.display=(!demo&&t-Date.parse(D.gen)>D.cfg.stale*3600e3)?'block':'none';}
tick();setInterval(tick,250);
setTimeout(()=>location.reload(),15*60e3);   // picks up the regenerated file
</script></body></html>
